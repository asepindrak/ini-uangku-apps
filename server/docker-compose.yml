version: '3.8'

services:
  iniuangku-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: iniuangku_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - PORT=${PORT:-3000}
      - HOST=${HOST:-0.0.0.0}
      - BAILEYS_AUTH_DIR=${BAILEYS_AUTH_DIR:-/app/baileys_auth}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    volumes:
      - baileys_data:/app/baileys_auth
    networks:
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      # 1. HTTP -> HTTPS Auto Redirect
      - "traefik.http.middlewares.iniuangku-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.iniuangku-redirect.redirectscheme.permanent=true"
      - "traefik.http.routers.iniuangku-web.rule=Host(`iniuangku.raydrop.web.id`)"
      - "traefik.http.routers.iniuangku-web.entrypoints=web"
      - "traefik.http.routers.iniuangku-web.middlewares=iniuangku-redirect"
      # 2. HTTPS & WSS (Port 443 with Let's Encrypt SSL)
      - "traefik.http.routers.iniuangku.rule=Host(`iniuangku.raydrop.web.id`)"
      - "traefik.http.routers.iniuangku.entrypoints=websecure"
      - "traefik.http.routers.iniuangku.tls=true"
      - "traefik.http.routers.iniuangku.tls.certresolver=letsencrypt"
      - "traefik.http.routers.iniuangku.service=iniuangku-svc"
      - "traefik.http.services.iniuangku-svc.loadbalancer.server.port=3000"

volumes:
  baileys_data:
    driver: local

networks:
  dokploy-network:
    external: true

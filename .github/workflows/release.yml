name: Release Ini Uangku Desktop Installers

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: '--bundles msi'
          - platform: 'ubuntu-22.04'
            args: '--bundles deb,appimage'
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin --bundles dmg'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and Publish Tauri Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'Ini Uangku v__VERSION__'
          releaseBody: |
            <p align="center">
              <img src="https://raw.githubusercontent.com/asepindrak/ini-uangku/main/logo.png" alt="Ini Uangku Logo" width="180" />
            </p>

            <h2 align="center">Ini Uangku v__VERSION__ Release 🎀</h2>

            <p align="center">
              <strong>Smart Family Finance Multiplatform with AI Agent & Human-in-the-Loop Approval</strong>
            </p>

            ---

            ### 📦 Available Downloads

            | Operating System | Package | Architecture | Description |
            | :--- | :---: | :---: | :--- |
            | **Windows** | `.msi` | x64 (64-bit) | `Ini_Uangku___VERSION___x64_en-US.msi` — Official Windows Installer |
            | **macOS** | `.dmg` | Universal | `Ini_Uangku___VERSION___universal.dmg` — Native Universal DMG for Apple Silicon (M1-M4) & Intel |
            | **Linux (Universal)** | `.AppImage` | x64 (amd64) | `Ini_Uangku___VERSION___amd64.AppImage` — Portable standalone binary |
            | **Linux (Debian/Ubuntu)** | `.deb` | x64 (amd64) | `Ini_Uangku___VERSION___amd64.deb` — Debian/Ubuntu package |
            | **Android** | `.apk` | ARM64 (`arm64-v8a`) | `Ini_Uangku-arm64-v8a.apk` — Native Android APK |

            ---

            ### 🚀 Highlights & Features
            - **Human-in-the-Loop AI Bookkeeping:** AI bot scans receipts and handwritten notes with approval before journaling.
            - **WhatsApp (Baileys) & Telegram Bot:** Integrated family messaging bot with strict whitelist security.
            - **Multi-Wallet per Family Member:** Individual and shared family wallets.
            - **Sinking Funds & Auto Recurring Bills:** Automated reminders and budget guardrails.
            - **Pastel Glassmorphism UI:** Aesthetic design tailored for modern families with 1-click Privacy Blur mode.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
